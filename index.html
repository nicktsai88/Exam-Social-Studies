<style>
:root{--ink:#49362f;--red:#ad3947;--cream:#fffaf4;--line:#eadbd0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(#eadfd5 1px,transparent 1px) 0 0/22px 22px,var(--cream);color:var(--ink);font-family:'Noto Sans TC',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #d98672;outline-offset:2px}.wrap{max-width:1180px;margin:auto;padding:30px 20px 90px}header{text-align:center;padding:40px 14px 28px}header h1{font-size:clamp(2rem,6vw,3.5rem);letter-spacing:.06em;margin:8px 0;color:#79313f}header p{color:#776760;margin:8px 0 20px}.pill{display:inline-block;border-radius:30px;background:white;border:1px solid var(--line);padding:8px 18px;font-weight:700}.toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0}.btn{border:0;border-radius:12px;background:var(--red);color:white;padding:10px 17px;font-weight:700}.btn:hover{filter:brightness(.94)}.btn.secondary{background:#fff;color:var(--red);border:1px solid #d7afb5}.btn.ghost{background:transparent;color:#725d56;padding:7px 10px}.search{padding:11px 15px;border:1px solid var(--line);border-radius:12px;background:white;width:min(350px,100%)}.notice{font-size:.9rem;color:#826e66;text-align:center;margin:12px 0 34px}.group{margin:0 0 42px}.group-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:18px}.group-head h2{font-size:1.45rem;margin:0}.group-actions{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.count{font-size:.85rem;color:#806b63}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-top:5px solid #c46769;border-radius:15px;padding:18px;box-shadow:0 5px 15px #65402a12;min-height:145px;display:flex;flex-direction:column;gap:8px}.card.done{border-color:#66a780;border-top-color:#4b9a6a;background:#f5fff8}.card-title{font-size:1.18rem;font-weight:900;overflow-wrap:anywhere}.card a{color:#8e3047;font-weight:700;text-decoration:none;overflow-wrap:anywhere}.card a:hover{text-decoration:underline}.card-actions{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:auto}.empty{border:2px dashed #dfcec0;border-radius:14px;padding:22px;color:#85736b;background:#fff9}.muted{color:#86766f;font-size:.88rem}.modal-back{position:fixed;inset:0;background:#201b1b9c;display:grid;place-items:center;padding:20px;z-index:10}.modal{background:white;border-radius:18px;padding:25px;width:min(460px,100%);box-shadow:0 20px 60px #0003}.modal h2{margin:0 0 18px}.field{display:block;font-weight:700;margin:13px 0}.field input{display:block;width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #cabdb6}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}footer{text-align:center;color:#8b7a72;font-size:.85rem}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#49362f;color:#fff;padding:10px 18px;border-radius:10px;z-index:20}#toast[hidden],.modal-back[hidden]{display:none}@media(max-width:600px){.wrap{padding:12px 15px 60px}header{padding-top:26px}.group-head{align-items:flex-start}.group-actions{width:100%}.grid{grid-template-columns:1fr}}
.back-home{display:table;margin:0 auto 20px;padding:14px 24px;border:3px solid #ffd600;border-radius:16px;background:#fffbe3;color:#513400;font-weight:900;font-size:clamp(1rem,3.5vw,1.3rem);text-decoration:none;box-shadow:0 0 0 5px #fff86a,0 0 22px 9px #ffea00;transition:transform .18s,box-shadow .18s}.back-home:hover{transform:translateY(-2px);box-shadow:0 0 0 6px #fff86a,0 0 28px 12px #ffdf00}.back-home:focus-visible{outline:3px solid #49362f;outline-offset:8px}

.group-identity{display:flex;align-items:center;gap:22px;max-width:100%;min-width:0}.group-identity h2{min-width:0;overflow-wrap:anywhere}.book-cover{width:188px;height:264px;object-fit:contain;background:#f5eee7;border-radius:8px;flex-shrink:0}.cover-preview{display:block;max-width:100%;height:220px;object-fit:contain;margin:16px auto}.cover-preview[hidden]{display:none}.cover-hint{font-size:.88rem;color:#806b63;line-height:1.7}.cover-progress{width:100%}button:disabled{opacity:.55;cursor:wait}.modal{max-height:90vh;overflow:auto}
@media(max-width:600px){.group-identity{width:100%;flex-direction:column;align-items:flex-start;gap:14px}.book-cover{width:160px;height:225px;max-width:100%}}

<body><main class="wrap"><header><a class="back-home" href="https://nicktsai88.github.io/List/">↩ 返回快樂學習百寶箱</a><div class="pill">📚 國中會考・社會科</div><h1>社會科解析目錄</h1><p>依題庫分類，快速找到每一回的解析教學</p><div class="pill">☁️ Firebase 雲端同步版 v3</div><div class="pill" id="stats"></div><div class="toolbar"><button type="button" class="btn" id="addGroup">＋ 新增主要分類</button><input class="search" id="search" type="search" placeholder="🔎 搜尋分類或解析項目" aria-label="搜尋分類或解析項目"></div><div class="notice" id="syncStatus">☁️ 正在連線雲端；連線完成後可跨裝置同步。</div><div class="toolbar"><button type="button" class="btn secondary" id="export">⬇ 匯出備份</button><button type="button" class="btn secondary" id="import">⬆ 匯入備份</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></header><div id="groups"></div><footer>✍️ 可新增分類與解析連結，也可標記完成進度</footer></main><div class="modal-back" id="modal" hidden><form class="modal" id="form"><h2 id="modalTitle"></h2><label class="field">名稱 <input id="name" maxlength="100" required placeholder="例如：第 1 回解析"></label><label class="field" id="urlField">解析網址或檔名（可稍後填寫）<input id="url" maxlength="2048" placeholder="例如：geography-01.html 或 https://..."></label><div class="modal-actions"><button class="btn secondary" type="button" id="cancel">取消</button><button class="btn" type="submit">儲存</button></div></form></div><div class="modal-back" id="coverModal" hidden><form class="modal" id="coverForm" aria-labelledby="coverTitle"><h2 id="coverTitle">書本封面</h2><label class="field">選擇封面圖片<input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="cover-hint">支援 JPG、PNG、WebP，每張最多 5 MB。選好圖片後，按「上傳並儲存」同步到雲端。</p><img id="coverPreview" class="cover-preview" alt="封面預覽" hidden><progress id="coverProgress" class="cover-progress" max="100" value="0" hidden></progress><p id="coverStatus" class="cover-hint" role="status" aria-live="polite"></p><div class="modal-actions"><button type="button" class="btn secondary" id="coverCancel">取消</button><button type="submit" class="btn" id="coverSave" disabled>上傳並儲存</button></div></form></div><div id="toast" role="status" hidden></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import {getFirestore,doc,onSnapshot,runTransaction} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
import {getStorage,ref as storageRef,uploadBytesResumable,getDownloadURL} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js';
const firebaseConfig={apiKey:"AIzaSyAxQFt76ZPXE7d0i1XeNZ1yiiD2WYNIfHs",authDomain:"chinese-learning-47f4d.firebaseapp.com",projectId:"chinese-learning-47f4d",storageBucket:"chinese-learning-47f4d.firebasestorage.app",messagingSenderId:"76289812052",appId:"1:76289812052:web:898384a916f9f341f62fc1"};
const FIRESTORE_DOCUMENT_PATH = 'Exam-Social Studies/global';
const defaults=['社會第一冊','社會第二冊','社會第三冊','社會第四冊','社會第五冊','社會第六冊','社會模擬考'].map((name,i)=>({id:'default-'+i,name,items:[]}));
const $=s=>document.querySelector(s);const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
function validCover(value){if(value===undefined||value==='')return true;if(typeof value!=='string'||value.length>4096)return false;try{return new URL(value).protocol==='https:'}catch{return false}}
function valid(data){return Array.isArray(data)&&data.length<=500&&data.every(g=>g&&typeof g.id==='string'&&typeof g.name==='string'&&g.name.length<=100&&validCover(g.coverUrl)&&Array.isArray(g.items)&&g.items.length<=2000&&g.items.every(i=>i&&typeof i.id==='string'&&typeof i.name==='string'&&i.name.length<=100&&typeof i.url==='string'&&i.url.length<=2048));}
let groups=defaults,ready=false,queue=Promise.resolve();const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app),ref=doc(db,FIRESTORE_DOCUMENT_PATH),storage=getStorage(app);
function status(message){$('#syncStatus').textContent=message}
function commit(change){if(!ready){toast('雲端尚未連線，請稍後再試');return Promise.resolve(false)}queue=queue.then(async()=>{status('☁️ 儲存中…');let next;await runTransaction(db,async tx=>{const snap=await tx.get(ref);if(snap.exists()&&!valid(snap.data().groups))throw Error('雲端資料格式異常，已停止儲存以保護原資料');const current=snap.exists()?snap.data().groups:defaults;next=structuredClone(current);change(next);if(!valid(next))throw Error('invalid');tx.set(ref,{groups:next,updatedAt:new Date()})});groups=next;render();status('☁️ 已同步至雲端');return true}).catch(err=>{console.error(err);status('⚠️ 雲端儲存失敗：請檢查 Firestore 權限及網路');toast('儲存失敗，請重試');return false});return queue}
onAuthStateChanged(auth,user=>{if(!user){signInAnonymously(auth).catch(err=>{console.error(err);status('⚠️ 無法登入雲端：請啟用 Firebase 匿名登入')});return}onSnapshot(ref,snap=>{if(snap.metadata.fromCache){ready=false;status('⚠️ 目前為快取資料，等待網路連線');return}if(snap.exists()&&!valid(snap.data().groups)){ready=false;status('⚠️ 雲端資料格式異常，已停止編輯；請先檢查資料');return}groups=snap.exists()?snap.data().groups:defaults;ready=true;status('☁️ 已同步至雲端');render()},err=>{console.error(err);ready=false;status('⚠️ 無法讀取雲端：請檢查 Firestore 規則及網路')})});
let edit=null;let query='';const host=$('#groups');

function toast(message){const el=$('#toast');el.textContent=message;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,3500)}
function button(label,action,groupId,itemId,cls='ghost'){const b=document.createElement('button');b.type='button';b.className='btn '+cls;b.textContent=label;b.addEventListener('click',()=>action(groupId,itemId));return b}
function safeUrl(raw){const s=raw.trim();if(!s)return '';if(/[\u0000-\u001f\\]/.test(s)||s.startsWith('//'))return null;try{const u=new URL(s,location.href);if(['http:','https:'].includes(u.protocol))return s}catch{}return null}
function render(){host.replaceChildren();let total=0,done=0;const q=query.toLocaleLowerCase();for(const g of groups){total+=g.items.length;done+=g.items.filter(i=>i.done).length;const matched=g.name.toLocaleLowerCase().includes(q);const items=matched?g.items:g.items.filter(i=>i.name.toLocaleLowerCase().includes(q));if(q&&!matched&&!items.length)continue;const section=document.createElement('section');section.className='group';const head=document.createElement('div');head.className='group-head';const h=document.createElement('h2');h.textContent='📖 '+g.name;const actions=document.createElement('div');actions.className='group-actions';const count=document.createElement('span');count.className='count';count.textContent=`${g.items.length} 個項目`;actions.append(count,button('＋ 新增次要項目',openItem,g.id,null,'secondary'),button('編輯分類',openGroup,g.id),button('刪除分類',removeGroup,g.id));const identity=document.createElement('div');identity.className='group-identity';if(g.coverUrl&&validCover(g.coverUrl)){const cover=document.createElement('img');cover.className='book-cover';cover.src=g.coverUrl;cover.alt=g.name+'書本封面';cover.loading='lazy';cover.addEventListener('error',()=>{cover.hidden=true;const hint=document.createElement('span');hint.className='muted';hint.textContent='封面暫時無法載入';identity.prepend(hint)},{once:true});identity.append(cover)}identity.append(h);actions.append(button(g.coverUrl?'更換封面':'上傳封面',openCover,g.id));if(g.coverUrl)actions.append(button('移除封面',removeCover,g.id));head.append(identity,actions);section.append(head);const grid=document.createElement('div');grid.className='grid';if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=q?'沒有符合搜尋的項目':'尚無解析項目，點選「新增次要項目」開始建立。';grid.append(empty)}items.forEach(item=>{const card=document.createElement('article');card.className='card'+(item.done?' done':'');const title=document.createElement('div');title.className='card-title';title.textContent=item.name;card.append(title);const url=safeUrl(item.url);if(url){const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='🔗 開啟解析教學 ↗';card.append(link)}else{const hint=document.createElement('div');hint.className='muted';hint.textContent='尚未設定解析連結';card.append(hint)}const controls=document.createElement('div');controls.className='card-actions';controls.append(button(item.done?'✅ 已完成':'○ 標記完成',toggleDone,g.id,item.id),button('編輯',openItem,g.id,item.id),button('刪除',removeItem,g.id,item.id));card.append(controls);grid.append(card)});section.append(grid);host.append(section)}if(!host.children.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=query?'沒有符合搜尋的分類或項目':'尚無分類，點選「新增主要分類」開始建立。';host.append(empty)}$('#stats').textContent=`✅ 已完成 ${done} / ${total} 個解析項目`}
function group(id){return groups.find(g=>g.id===id)}
function open(kind,gid,iid){edit={kind,gid,iid};const g=group(gid),i=iid&&g?.items.find(x=>x.id===iid);$('#modalTitle').textContent=kind==='group'?(g?'編輯主要分類':'新增主要分類'):(i?'編輯次要項目':'新增次要項目');$('#name').value=kind==='group'?(g?.name||''):(i?.name||'');$('#url').value=i?.url||'';$('#urlField').hidden=kind==='group';$('#modal').hidden=false;$('#name').focus()}
function openGroup(gid){open('group',gid,null)}function openItem(gid,iid){open('item',gid,iid)}function close(){edit=null;$('#modal').hidden=true}
$('#form').addEventListener('submit',e=>{e.preventDefault();if(!edit)return;if(!ready){toast('雲端尚未連線，請稍後再試');return}const name=$('#name').value.trim();if(!name)return;const {kind,gid,iid}=edit;const url=$('#url').value.trim();if(kind==='item'&&safeUrl(url)===null){toast('請填寫 http(s) 網址或同資料夾內的檔名');return}commit(data=>{if(kind==='group'){const g=data.find(x=>x.id===gid);if(g)g.name=name;else data.push({id:uid(),name,items:[]})}else{const g=data.find(x=>x.id===gid);if(!g)throw Error('分類已刪除');const i=g.items.find(x=>x.id===iid);if(i){i.name=name;i.url=url}else g.items.push({id:uid(),name,url,done:false})}});close()});
function removeGroup(gid){const g=group(gid);if(!g||!confirm(`確定刪除「${g.name}」及其中 ${g.items.length} 個項目嗎？`))return;commit(data=>{const index=data.findIndex(x=>x.id===gid);if(index!==-1)data.splice(index,1)})}
function removeItem(gid,iid){const g=group(gid),i=g?.items.find(x=>x.id===iid);if(!i||!confirm(`確定刪除「${i.name}」嗎？`))return;commit(data=>{const target=data.find(x=>x.id===gid);if(target)target.items=target.items.filter(x=>x.id!==iid)})}
function toggleDone(gid,iid){commit(data=>{const i=data.find(x=>x.id===gid)?.items.find(x=>x.id===iid);if(i)i.done=!i.done})}
$('#addGroup').addEventListener('click',()=>openGroup(null));$('#cancel').addEventListener('click',close);$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();closeCover()}});$('#search').addEventListener('input',e=>{query=e.target.value.trim();render()});
$('#export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(groups,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='社會科解析目錄備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});$('#import').addEventListener('click',()=>$('#importFile').click());$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>5*1024*1024){toast('備份檔案過大');return}try{const data=JSON.parse(await file.text());if(!valid(data))throw Error();if(!confirm('匯入會取代目前所有分類與項目，確定繼續嗎？'))return;if(!ready){toast('雲端尚未連線，請稍後再試');return}commit(current=>{current.splice(0,current.length,...data)});toast('匯入要求已送出')}catch{toast('檔案格式不正確，匯入失敗')}});render();

let coverGroupId=null,coverFile=null,previewUrl=null,coverBusy=false,coverSelection=0,coverReturnFocus=null;
function clearPreview(){if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;$('#coverPreview').removeAttribute('src');$('#coverPreview').hidden=true}
function openCover(gid){if(!ready){toast('雲端尚未連線，請稍後再試');return}const g=group(gid);if(!g)return;coverReturnFocus=document.activeElement;coverGroupId=gid;coverFile=null;coverSelection++;clearPreview();$('#coverTitle').textContent=g.name+'・書本封面';$('#coverFile').value='';$('#coverStatus').textContent='';$('#coverSave').disabled=true;$('#coverProgress').hidden=true;if(g.coverUrl){$('#coverPreview').src=g.coverUrl;$('#coverPreview').hidden=false}$('#coverModal').hidden=false;$('#coverFile').focus()}
function closeCover(){if(coverBusy)return;coverSelection++;clearPreview();coverGroupId=null;coverFile=null;$('#coverModal').hidden=true;coverReturnFocus?.focus()}
$('#coverCancel').addEventListener('click',closeCover);
$('#coverModal').addEventListener('click',e=>{if(e.target===$('#coverModal'))closeCover()});
$('#coverFile').addEventListener('change',async e=>{
 const selection=++coverSelection;const file=e.target.files[0];coverFile=null;$('#coverSave').disabled=true;clearPreview();$('#coverStatus').textContent='';if(!file)return;
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size===0||file.size>5*1024*1024){$('#coverStatus').textContent='請選擇 5 MB 以內的 JPG、PNG 或 WebP 圖片。';return}
 const url=URL.createObjectURL(file);const probe=new Image();probe.src=url;
 try{await probe.decode();if(selection!==coverSelection){URL.revokeObjectURL(url);return}previewUrl=url;coverFile=file;$('#coverPreview').src=url;$('#coverPreview').hidden=false;$('#coverSave').disabled=false;$('#coverStatus').textContent='圖片已就緒，按「上傳並儲存」即可。'}catch{URL.revokeObjectURL(url);if(selection===coverSelection)$('#coverStatus').textContent='無法讀取這張圖片，請重新選擇。'}
});
$('#coverForm').addEventListener('submit',async e=>{
 e.preventDefault();if(coverBusy||!coverFile||!coverGroupId)return;if(!ready||!auth.currentUser){$('#coverStatus').textContent='雲端尚未連線，請稍後再試。';return}
 const gid=coverGroupId,file=coverFile;coverBusy=true;$('#coverFile').disabled=true;$('#coverCancel').disabled=true;$('#coverSave').disabled=true;$('#coverProgress').hidden=false;$('#coverProgress').value=0;
 let saved=false;
 try{
  const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];
  const path='english-covers/'+auth.currentUser.uid+'/'+uid()+'.'+ext;
  const task=uploadBytesResumable(storageRef(storage,path),file,{contentType:file.type,cacheControl:'public,max-age=31536000,immutable'});
  await new Promise((resolve,reject)=>task.on('state_changed',snap=>{const percent=Math.round(snap.bytesTransferred/snap.totalBytes*100);$('#coverProgress').value=percent;$('#coverStatus').textContent='封面上傳中：'+percent+'%'},reject,resolve));
  const url=await getDownloadURL(task.snapshot.ref);$('#coverStatus').textContent='圖片已上傳，正在同步分類…';
  saved=await commit(data=>{const g=data.find(x=>x.id===gid);if(!g)throw Error('分類已刪除');g.coverUrl=url});
  if(!saved)throw Error('圖片已上傳，但分類儲存失敗；請確認分類仍存在及網路連線後重試。');
 }catch(err){console.error(err);const messages={'storage/unauthorized':'沒有封面上傳權限，請檢查 Firebase Storage 規則。','storage/bucket-not-found':'尚未建立圖片儲存空間，請啟用 Firebase Storage。','storage/quota-exceeded':'雲端圖片空間或用量已達上限，請檢查 Firebase 方案。','storage/retry-limit-exceeded':'連線逾時，請確認網路後重試。'};$('#coverStatus').textContent=messages[err.code]||err.message||'上傳失敗，請稍後重試。';
 }finally{coverBusy=false;$('#coverFile').disabled=false;$('#coverCancel').disabled=false;$('#coverSave').disabled=!coverFile;if(saved){closeCover();toast('書本封面已儲存至雲端')}}
});
async function removeCover(gid){const g=group(gid);if(!g?.coverUrl||!confirm('確定移除「'+g.name+'」的封面顯示嗎？'))return;const success=await commit(data=>{const target=data.find(x=>x.id===gid);if(target)delete target.coverUrl});if(success)toast('已移除封面顯示')}
</script></body></html>
